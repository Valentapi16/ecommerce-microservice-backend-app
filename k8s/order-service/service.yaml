apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ecommerce-staging
  labels:
    app: order-service
    tier: business
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
  - name: http
    port: 8083
    targetPort: 8083
    protocol: TCP
  sessionAffinity: None
