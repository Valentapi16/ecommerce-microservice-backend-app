# Locust Configuration File
# This file configures Locust to avoid port conflicts with Jenkins

# Web interface port (Jenkins uses 8080, so we use 8089)
web-port = 8089

# Default host (can be overridden in command line)
host = http://localhost:8080

# Number of users to spawn
# users = 10

# Spawn rate (users per second)
# spawn-rate = 1

# Run time (optional, for automated tests)
# run-time = 5m

# Headless mode (for CI/CD, no web interface)
# headless = false

# Log level
loglevel = INFO

# CSV output prefix (for saving results)
# csv = results/locust_results
